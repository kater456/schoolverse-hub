<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Anatomy Test Bank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f3ee;--surface:#fffdf9;--fg:#23201c;--muted:#6b645b;--line:#e2dcd2;--accent:#9b2c2c;--accent-fg:#fff;--ok:#2f6b3f;--okbg:#e4f0e3;--bad:#a12a2a;--badbg:#f6e1df;--note:#7a5a12;--notebg:#f7edd0;--chip:#ece6db}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--surface:#201d1a;--fg:#ece6dc;--muted:#a39b8f;--line:#35302a;--accent:#e08a7a;--accent-fg:#1a0f0c;--ok:#8fd09f;--okbg:#1e3022;--bad:#f09a94;--badbg:#3a1f1d;--note:#e3c46f;--notebg:#352c14;--chip:#2b2722;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171513;--surface:#201d1a;--fg:#ece6dc;--muted:#a39b8f;--line:#35302a;--accent:#e08a7a;--accent-fg:#1a0f0c;--ok:#8fd09f;--okbg:#1e3022;--bad:#f09a94;--badbg:#3a1f1d;--note:#e3c46f;--notebg:#352c14;--chip:#2b2722;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 Inter,system-ui,sans-serif;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto}
h1,h2{font-family:Fraunces,Georgia,serif;text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(1.9rem,6vw,2.6rem)}
h2{font-size:1.3rem}
.sub{color:var(--muted);margin:.5rem 0 1.5rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.lbl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:7px 13px;font:inherit;font-size:.9rem;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip small{opacity:.7;margin-left:4px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:12px 20px;font-weight:600;min-height:46px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;font-size:.88rem;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin-bottom:16px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:.75rem;background:var(--chip);border-radius:6px;padding:2px 8px;color:var(--muted)}
.tag.rep{background:var(--notebg);color:var(--note)}
.q{font-size:1.1rem;font-weight:500;margin:0 0 16px;overflow-wrap:anywhere;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;text-align:left;width:100%;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;min-height:48px;align-items:flex-start}
.opt .k{font-weight:600;color:var(--muted);min-width:1.2em}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--chip)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:.95rem}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.note{background:var(--notebg);color:var(--note)}
.fb b{display:block}
.fb small{display:block;margin-top:4px;opacity:.9;color:inherit}
.hint{font-size:.82rem;color:var(--muted);margin-top:10px}
.big{font-family:Fraunces,serif;font-size:3.2rem;font-weight:700;line-height:1}
.tbl{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.92rem}
.trow .m{grid-column:1/-1;height:5px;background:var(--chip);border-radius:9px;overflow:hidden}
.trow .m i{display:block;height:100%;background:var(--ok)}
.revq{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;font-size:.93rem}
.revq .a{color:var(--ok);font-weight:600}
.revq .y{color:var(--bad)}
.theme{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:.8rem}
.disc{font-size:.82rem;color:var(--note);background:var(--notebg);border-radius:10px;padding:10px 12px}
@media (max-width:420px){.card{padding:14px}.big{font-size:2.6rem}}
</style>

llowing is false about the body of uterus","o":[["A","Has a very thick wall made up mainly of muscle and elastic tissue."],["B","The lumen is small"],["C","The lumen is lined by mucous membrane."],["D","Part of the uterus is covered on the outside by peritoneum."]]},{"i":520,"n":108,"s":"Histology","t":"Epithelium & Glands","p":"Mock Exam","y":"mcq","q":"One of the following is not a main types of specialization luminal or apical surface","o":[["A","cilia"],["B","microvilli"],["C","sterocilia"],["D","desmosomes"]],"a":"D"},{"i":521,"n":109,"s":"Histology","t":"Skin & Appendages","p":"Main Exam","y":"mcq","q":"Nails undergo constant growth by proliferation of cells in the ——-","o":[["A","Hyponychium"],["B","Lunule"],["C","Germinal matrix"],["D","Eponychium"],["E","Nail groove"]],"a":"C"},{"i":522,"n":110,"s":"Histology","t":"Skin & Appendages","p":"Main Exam","y":"mcq","q":"A hair is a modified part of the stratum","o":[["A","Lucidum"],["B","Corneum"],["C","Basale"],["D","Spinosum"],["E","Granulosum"]],"a":"B","r":["Mock Exam"]},{"i":523,"n":111,"s":"Histology","t":"Muscle Tissue","p":"Main Exam","y":"mcq","q":"Functional unit of muscle","o":[["A","Sarcolemma"],["B","Sarcoplasm"],["C","Sarcosome"],["D","Sarcomere"]],"a":"D"},{"i":524,"n":112,"s":"Histology","t":"Muscle Tissue","p":"Main Exam","y":"mcq","q":"Running across each I-band is a thin dark line called","o":[["A","A-band. ."],["B","Z-band."],["C","H- band."],["D","M-band"]],"a":"B"},{"i":525,"n":113,"s":"Histology","t":"Connective Tissue, Bone & Cartilage","p":"Main Exam","y":"mcq","q":"Elastic fibrocartilage","o":[["A","Corniculate"],["B","Cuneiform"],["C","Cricoid"],["D","Tritiate"]]},{"i":526,"n":114,"s":"Histology","t":"Blood & Haemopoiesis","p":"Main Exam","y":"mcq","q":"Which of the following are not myeloid cells?","o":[["A","Basophils"],["B","Macrophages"],["C","Monocytes"],["D","Neutrophils"],["E","T cells"]],"a":"E","r":["First Test"]},{"i":527,"n":115,"s":"Histology","t":"Blood & Haemopoiesis","p":"Main Exam","y":"mcq","q":"One of the following is characterized with S-shaped nucleus","o":[["A","Monocyte"],["B","Basophil"],["C","Neutrophil"],["D","Basophil"],["E","Erythrocyte"]]},{"i":528,"n":116,"s":"Histology","t":"Blood & Haemopoiesis","p":"Main Exam","y":"mcq","q":"An internal network or reticulum from residual RNA (substantia granulo-reticulo- filamentosa) is found in:","o":[["A","monocytes"],["B","reticulocytes"],["C","erythrocytes"],["D","megakaryocytes"],["E","None of the above"]],"a":"B"},{"i":529,"n":117,"s":"Histology","t":"Blood & Haemopoiesis","p":"Main Exam","y":"mcq","q":"In iron deficiency anemia, the RBCs are ———","o":[["A","Microcytic and hypochromic"],["B","Macrocytic and macrochromic"],["C","Normocytic and Normchromic"],["D","Spherocytic"],["E","Spherocytic and macrochromic"]],"a":"A"},{"i":530,"n":118,"s":"Histology","t":"Blood & Haemopoiesis","p":"Main Exam","y":"mcq","q":"One of the following is not agranulocytes","o":[["A","Neutrophils"],["B","Eosinophils"],["C","Basophils"],["D","lymphocytes"]]},{"i":531,"n":119,"s":"Histology","t":"Lymphoid Organs","p":"Main Exam","y":"mcq","q":"Nurse cells of the thymus","o":[["A","Type 1"],["B","Type 2 & 3"],["C","Type 4"],["D","Type 5"]]},{"i":532,"n":120,"s":"Histology","t":"Urinary System","p":"Main Exam","y":"mcq","q":"False about Distal convulated tubule (DCT)","o":[["A","Has simple columnar epithelium"],["B","Plentiful mitochondria"],["C","Basolateral interdigitations"],["D","Few small microvilli"],["E","Prominent basal in-folding"]],"a":"A"},{"i":533,"n":121,"s":"Histology","t":"Digestive System","p":"Main Exam","y":"mcq","q":"Auerbach’s plexus","o":[["A","serosa"],["B","lamina propria"],["C","muscularis externa"],["D","submucosa"]],"a":"C"},{"i":534,"n":122,"s":"Histology","t":"Reproductive System","p":"Main Exam","y":"mcq","q":"The ducts of mammary gland are lined by — epithelium","o":[["A","columnar"],["B","cuboidal"],["C","squamous"],["D","pseudostratified cuboidal"]]},{"i":535,"n":123,"s":"Histology","t":"Digestive System","p":"Main Exam","y":"mcq","q":"glucagon","o":[["A","A-cells"],["B","B-cells"],["C","C-cells"],["D","D-cells"]],"a":"A"},{"i":536,"n":124,"s":"Histology","t":"Digestive System","p":"Main Exam","y":"essay","q":"Give an account of the gross and microscopic anatomy of the esophagus. Add a note on its development","o":[]},{"i":537,"n":125,"s":"Histology","t":"Reproductive System","p":"Main Exam","y":"essay","q":"Write a short note on the following: C. Histology of the prostate gland","o":[]}];
const SECS=['Gross','Embryology','Histology'];
const SK='anatquiz:v1';
let store={missed:[],done:0};
try{const s=localStorage.getItem(SK);if(s)store=Object.assign(store,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(store))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId=new Map(DATA.map(r=>[r.i,r]));
let cfg={secs:new Set(['Gross']),topics:new Set(),mode:'practice',selfcheck:true,shuffle:true,count:0,only:'all'};
let run=null;

function isCheck(r){return r.y==='essay'||r.y==='open'||!r.a}
function pool(){
  return DATA.filter(r=>{
    if(!cfg.secs.has(r.s))return false;
    if(cfg.topics.size&&!cfg.topics.has(r.s+'|'+r.t))return false;
    if(!cfg.selfcheck&&isCheck(r))return false;
    if(cfg.only==='missed'&&!store.missed.includes(r.i))return false;
    return true;
  });
}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function home(){
  run=null;
  const p=pool();
  const tops={};
  DATA.forEach(r=>{if(cfg.secs.has(r.s)){const k=r.s+'|'+r.t;tops[k]=(tops[k]||0)+1}});
  const secCount=s=>DATA.filter(r=>r.s===s).length;
  const n=cfg.count?Math.min(cfg.count,p.length):p.length;
  $('#app').innerHTML=`
  <div class="row sb" style="margin-bottom:18px"><span class="tag">First Test – Main Exam · 5 papers</span><button class="theme" id="th">Theme</button></div>
  <h1>Anatomy Test Bank</h1>
  <p class="sub">All ${DATA.length} questions from your past papers, grouped by section and topic. Pick what to practise.</p>
  <div class="stack">
   <div class="card"><div class="lbl">Sections</div><div class="chips">${SECS.map(s=>`<button class="chip" data-sec="${s}" aria-pressed="${cfg.secs.has(s)}">${s}<small>${secCount(s)}</small></button>`).join('')}</div></div>
   <div class="card"><div class="lbl">Topics <span style="text-transform:none;letter-spacing:0;font-weight:400">(none selected = all)</span></div><div class="chips">${Object.keys(tops).sort().map(k=>`<button class="chip" data-top="${esc(k)}" aria-pressed="${cfg.topics.has(k)}">${esc(k.split('|')[1])}<small>${tops[k]}</small></button>`).join('')}</div></div>
   <div class="card stack" style="gap:14px">
    <div><div class="lbl">Mode</div><div class="seg">
     <button class="chip" data-mode="practice" aria-pressed="${cfg.mode==='practice'}">Practice (answer shown at once)</button>
     <button class="chip" data-mode="exam" aria-pressed="${cfg.mode==='exam'}">Exam (results at the end)</button></div></div>
    <div><div class="lbl">Number of questions</div><div class="seg">${[[0,'All'],[20,'20'],[50,'50'],[100,'100']].map(([v,l])=>`<button class="chip" data-count="${v}" aria-pressed="${cfg.count===v}">${l}</button>`).join('')}</div></div>
    <div><div class="lbl">Options</div><div class="seg">
     <button class="chip" id="o-shuf" aria-pressed="${cfg.shuffle}">Shuffle order</button>
     <button class="chip" id="o-sc" aria-pressed="${cfg.selfcheck}">Include essays &amp; self-check</button>
     <button class="chip" id="o-miss" aria-pressed="${cfg.only==='missed'}">Only ones I missed (${store.missed.length})</button></div></div>
   </div>
   <div class="disc">The papers have no answer key. Answers shown are suggested by Claude and may be wrong, so confirm doubtful ones with your lecturer or notes. Essays and questions with damaged scans have no suggested answer and appear as self-check cards.</div>
   <div class="row"><button class="btn" id="go" ${n?'':'disabled'}>Start · ${n} question${n===1?'':'s'}</button></div>
  </div>`;
  document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{const s=b.dataset.sec;cfg.secs.has(s)?cfg.secs.delete(s):cfg.secs.add(s);if(!cfg.secs.size)cfg.secs.add(s);cfg.topics=new Set([...cfg.topics].filter(k=>cfg.secs.has(k.split('|')[0])));home()});
  document.querySelectorAll('[data-top]').forEach(b=>b.onclick=()=>{const k=b.dataset.top;cfg.topics.has(k)?cfg.topics.delete(k):cfg.topics.add(k);home()});
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.mode;home()});
  document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{cfg.count=+b.dataset.count;home()});
  $('#o-shuf').onclick=()=>{cfg.shuffle=!cfg.shuffle;home()};
  $('#o-sc').onclick=()=>{cfg.selfcheck=!cfg.selfcheck;home()};
  $('#o-miss').onclick=()=>{cfg.only=cfg.only==='missed'?'all':'missed';home()};
  $('#go').onclick=start;
  $('#th').onclick=toggleTheme;
}
function toggleTheme(){
  const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  r.dataset.theme=cur==='dark'?'light':'dark';
}
function start(){
  let p=pool();
  if(cfg.shuffle)p=shuf(p);
  if(cfg.count)p=p.slice(0,cfg.count);
  run={qs:p,i:0,ans:{},chk:{},done:false};
  show();
}
function show(){
  const r=run.qs[run.i],total=run.qs.length;
  const chk=isCheck(r);
  const picked=run.ans[r.i];
  const reveal=run.chk[r.i]||(cfg.mode==='exam'&&false);
  const opts=r.o.map(([k,t])=>{
    let c='opt';
    if(chk){}
    else if(reveal){if(k===r.a)c+=' ok';else if(k===picked)c+=' bad'}
    else if(k===picked)c+=' sel';
    return `<button class="${c}" data-k="${k}" ${reveal||chk?'disabled':''}><span class="k">${k}</span><span class="t">${esc(t)}</span></button>`}).join('');
  let fb='';
  if(chk){
    fb=`<div class="fb note"><b>${r.y==='essay'?'Essay — write your answer out, then check your notes.':'Self-check — no suggested answer for this one.'}</b>${r.x?`<small>${esc(r.x)}</small>`:''}</div>`;
  }else if(reveal){
    const good=picked===r.a;
    fb=`<div class="fb ${good?'ok':'bad'}"><b>${good?'Correct':picked?'Not quite':'Skipped'} — suggested answer: ${r.a}. ${esc((r.o.find(o=>o[0]===r.a)||[0,''])[1])}</b><small>Answer suggested by Claude, not from a marking scheme.</small>${r.x?`<small>${esc(r.x)}</small>`:''}</div>`;
  }
  const last=run.i===total-1;
  let nextLabel=last?'Finish':'Next';
  let primary;
  if(chk)primary=`<button class="btn" id="nx">${nextLabel}</button>`;
  else if(cfg.mode==='practice'&&!reveal)primary=`<button class="btn" id="chkb" ${picked?'':'disabled'}>Check answer</button>`;
  else primary=`<button class="btn" id="nx">${nextLabel}</button>`;
  $('#app').innerHTML=`
  <div class="top"><span>${run.i+1} / ${total}</span><button class="theme" id="quit">Quit</button></div>
  <div class="bar"><i style="width:${(run.i/total)*100}%"></i></div>
  <div class="card">
   <div class="meta"><span class="tag">${r.s}</span><span class="tag">${esc(r.t||'')}</span><span class="tag">${r.p}</span>${r.r?`<span class="tag rep">Also in: ${r.r.join(', ')}</span>`:''}${r.y==='match'?'<span class="tag">Matching item</span>':''}</div>
   <p class="q">${esc(r.q)}</p>
   <div class="opts">${opts}</div>
   ${fb}
   <div class="row sb" style="margin-top:18px"><button class="btn ghost" id="pv" ${run.i?'':'disabled'}>Back</button>${primary}</div>
  </div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{run.ans[r.i]=b.dataset.k;show()});
  $('#quit').onclick=()=>{if(Object.keys(run.ans).length)finish();else home()};
  $('#pv').onclick=()=>{run.i--;show()};
  const cb=$('#chkb');if(cb)cb.onclick=()=>{run.chk[r.i]=true;show()};
  const nx=$('#nx');if(nx)nx.onclick=()=>{last?finish():(run.i++,show())};
}
function finish(){
  const gradable=run.qs.filter(r=>!isCheck(r)&&run.ans[r.i]!==undefined);
  const right=gradable.filter(r=>run.ans[r.i]===r.a);
  const wrong=gradable.filter(r=>run.ans[r.i]!==r.a);
  const skipped=run.qs.filter(r=>!isCheck(r)&&run.ans[r.i]===undefined);
  const miss=new Set(store.missed);
  right.forEach(r=>miss.delete(r.i));
  wrong.forEach(r=>miss.add(r.i));
  store.missed=[...miss];store.done+=gradable.length;save();
  const byT={};
  run.qs.filter(r=>!isCheck(r)).forEach(r=>{const k=r.s+' · '+r.t;const o=byT[k]||(byT[k]={n:0,c:0});o.n++;if(run.ans[r.i]===r.a)o.c++});
  const checks=run.qs.filter(isCheck).length;
  const pct=gradable.length?Math.round(right.length/(run.qs.length-checks||1)*100):0;
  $('#app').innerHTML=`
  <h1>Results</h1>
  <p class="sub">Scored against Claude's suggested answers.</p>
  <div class="stack">
   <div class="card row" style="gap:20px"><div class="big">${right.length}<span style="font-size:1.4rem;color:var(--muted)"> / ${run.qs.length-checks}</span></div><div><div style="font-weight:600">${pct}% correct</div><div class="hint" style="margin:0">${wrong.length} wrong · ${skipped.length} unanswered${checks?` · ${checks} self-check card${checks>1?'s':''} not scored`:''}</div></div></div>
   <div class="card"><div class="lbl">By topic</div><div class="tbl">${Object.entries(byT).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([k,o])=>`<div class="trow"><span>${esc(k)}</span><span>${o.c}/${o.n}</span><div class="m"><i style="width:${o.c/o.n*100}%"></i></div></div>`).join('')}</div></div>
   ${wrong.length+skipped.length?`<div class="card"><div class="lbl">To review</div>${wrong.concat(skipped).map(r=>{const y=run.ans[r.i];return `<div class="revq"><div>${esc(r.q)}</div>${y?`<div class="y">Your answer: ${y}. ${esc((r.o.find(o=>o[0]===y)||[0,''])[1])}</div>`:'<div class="y">Unanswered</div>'}<div class="a">Suggested: ${r.a}. ${esc((r.o.find(o=>o[0]===r.a)||[0,''])[1])}</div></div>`}).join('')}</div>`:''}
   <div class="row"><button class="btn" id="again">New quiz</button>${store.missed.length?`<button class="btn ghost" id="redo">Practise missed (${store.missed.length})</button>`:''}</div>
  </div>`;
  $('#again').onclick=home;
  const rd=$('#redo');if(rd)rd.onclick=()=>{cfg.only='missed';cfg.secs=new Set(SECS);cfg.topics=new Set();cfg.count=0;start()};
}
home();
</script>

</body></html>
